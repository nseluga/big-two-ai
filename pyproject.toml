[project]
name = "bigtwo"
version = "0.0.0"
description = "Big Two simulator, evaluation harness, and Deep Monte-Carlo agents"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bigtwo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
